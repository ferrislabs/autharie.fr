# GitOps for the website. The docker workflow commits the new image tag to
# charts/autharie-website/values-production.yaml on every push to main, and
# ArgoCD syncs it. Apply this manifest once, by a human, after the first image
# has been built (the chart refuses an empty image.tag).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: autharie-website
  namespace: argocd
spec:
  project: autharie-website
  source:
    repoURL: https://github.com/ferrislabs/autharie.fr
    targetRevision: main
    path: charts/autharie-website
    helm:
      valueFiles:
        - values-production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: autharie-website
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
