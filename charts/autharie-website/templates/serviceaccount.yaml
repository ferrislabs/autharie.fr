{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "autharie-website.serviceAccountName" . }}
  labels:
    {{- include "autharie-website.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The pod never calls the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
