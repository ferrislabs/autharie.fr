{{- if .Values.gatewayApi.enabled }}
{{- if not .Values.gatewayApi.hostnames }}
{{- fail "gatewayApi.hostnames is required when gatewayApi.enabled is true" }}
{{- end }}
{{- if not .Values.gatewayApi.parentRefs }}
{{- fail "gatewayApi.parentRefs is required when gatewayApi.enabled is true" }}
{{- end }}
{{- $fullname := include "autharie-website.fullname" . }}
{{- $redirectRefs := default .Values.gatewayApi.parentRefs .Values.gatewayApi.redirect.parentRefs }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "autharie-website.labels" . | nindent 4 }}
  {{- with .Values.gatewayApi.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  hostnames:
    {{- range .Values.gatewayApi.hostnames }}
    - {{ . | quote }}
    {{- end }}
  parentRefs:
    {{- toYaml .Values.gatewayApi.parentRefs | nindent 4 }}
  rules:
    {{- if .Values.gatewayApi.immutableAssets.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gatewayApi.immutableAssets.pathPrefix }}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              {{- range $name, $value := .Values.gatewayApi.responseHeaders }}
              - name: {{ $name }}
                value: {{ $value | quote }}
              {{- end }}
              - name: Cache-Control
                value: "public, max-age=31536000, immutable"
      backendRefs:
        - name: {{ $fullname }}
          port: {{ .Values.service.port }}
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      {{- if .Values.gatewayApi.responseHeaders }}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              {{- range $name, $value := .Values.gatewayApi.responseHeaders }}
              - name: {{ $name }}
                value: {{ $value | quote }}
              {{- end }}
      {{- end }}
      backendRefs:
        - name: {{ $fullname }}
          port: {{ .Values.service.port }}
{{- if .Values.gatewayApi.redirect.enabled }}
{{- if or (not .Values.gatewayApi.redirect.from) (not .Values.gatewayApi.redirect.to) }}
{{- fail "gatewayApi.redirect.from and gatewayApi.redirect.to are required when the redirect is enabled" }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}-redirect
  labels:
    {{- include "autharie-website.labels" . | nindent 4 }}
spec:
  hostnames:
    {{- range .Values.gatewayApi.redirect.from }}
    - {{ . | quote }}
    {{- end }}
  parentRefs:
    {{- toYaml $redirectRefs | nindent 4 }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: {{ .Values.gatewayApi.redirect.to | quote }}
            statusCode: 301
{{- end }}
{{- end }}
