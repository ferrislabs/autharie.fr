{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "autharie-website.fullname" . }}
  labels:
    {{- include "autharie-website.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "autharie-website.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  # Only the Gateway's namespace may reach the pod. Nothing else needs to: the
  # site is static and makes no outbound calls.
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.gatewayNamespaceSelector | nindent 12 }}
      ports:
        - port: {{ .Values.containerPort }}
          protocol: TCP
{{- end }}
